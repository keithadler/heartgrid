<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeartGrid – printable grids</title>
<style>
body{font:14px/1.4 system-ui,sans-serif;color:#111;margin:24px auto;max-width:820px;padding:0 16px}
h1{margin:0 0 4px}.sub{color:#555;margin-bottom:16px}
section{break-inside:avoid;margin:0 0 28px;border-top:2px solid #111;padding-top:8px}
h2{margin:0 0 6px;font-size:17px}
canvas{max-width:100%;border:1px solid #999}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin-top:8px}
.q span{border-bottom:1px solid #111;min-height:22px;display:block}
.q label{font-size:12px;color:#555}
button{font:inherit;padding:6px 12px;margin-bottom:12px}
@media print{button,.sub a{display:none}body{margin:0}}
</style></head><body>
<h1>HeartGrid – grids with coordinates</h1>
<div class="sub">Origin (0, 0) is the bottom-left corner; x grows to the right, y grows upward.
♥ heart · ■ emerald block · ≈ water · ▲ hero · ◆ patrolling ghost · ◇ hunting ghost · ▯ door.</div>
<button onclick="print()">Print</button>
<div id="out"></div>
<script src="levels.js"></script><script src="engine.js"></script>
<script>
const CELL = 30, out = document.getElementById('out');
const sym = { '#': '#6b5f99', '.': '#fff', '~': '#8cc4ff' };
LEVELS.forEach(lv => {
  const rows = lv.rows, h = rows.length, w = rows[0].length, m = 22;
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>Room ${lv.n}: ${lv.name}</h2>`;
  const cv = document.createElement('canvas'); cv.width = w * CELL + m; cv.height = h * CELL + m;
  const g = cv.getContext('2d'); g.font = '12px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  rows.forEach((row, r) => [...row].forEach((ch, c) => {
    const x = m + c * CELL, y = r * CELL;
    g.fillStyle = sym[ch] || '#fff'; g.fillRect(x, y, CELL, CELL);
    g.strokeStyle = '#bbb'; g.strokeRect(x + .5, y + .5, CELL, CELL);
    g.fillStyle = '#000';
    const mark = { H: '♥', B: '■', P: '▲', E: '▯', '<': '◆', '>': '◆', '^': '◆', v: '◆', u: '◇', d: '◇', l: '◇', r: '◇' }[ch] ||
                 ({ '~': '≈' })[ch] || '';
    g.fillText(mark, x + CELL / 2, y + CELL / 2);
  }));
  g.fillStyle = '#000';
  for (let c = 0; c < w; c++) g.fillText(c, m + c * CELL + CELL / 2, h * CELL + 11);
  for (let r = 0; r < h; r++) g.fillText(h - 1 - r, 10, r * CELL + CELL / 2);
  sec.appendChild(cv);
  sec.insertAdjacentHTML('beforeend', `<div class="q">
    <div><label>Hero starts at (x, y)</label><span></span></div>
    <div><label>Hearts (list each point)</label><span></span></div>
    <div><label>Fewest moves you found</label><span></span></div></div>`);
  out.appendChild(sec);
});
</script></body></html>
